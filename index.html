<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>x-bot — Coming Soon</title>
  <meta name="description" content="India's first AI-native hiring platform. Coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080A;
      --accent: #00E5A0;
      --accent2: #5B8CFF;
      --text: #ECEEF2;
      --muted: rgba(236,238,242,0.4);
      --glass: rgba(255,255,255,0.05);
      --glass-border: rgba(255,255,255,0.09);
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Bricolage Grotesque', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
    }

    /* grain */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 100; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 256px; mix-blend-mode: overlay; opacity: 0.5;
    }

    /* orbs */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(110px); pointer-events: none; z-index: 0;
    }
    .orb-a {
      width: 550px; height: 550px;
      background: radial-gradient(circle, rgba(0,229,160,0.10) 0%, transparent 65%);
      top: -15%; right: -8%;
      animation: fa 22s ease-in-out infinite alternate;
    }
    .orb-b {
      width: 450px; height: 450px;
      background: radial-gradient(circle, rgba(91,140,255,0.09) 0%, transparent 65%);
      bottom: -10%; left: -8%;
      animation: fb 26s ease-in-out infinite alternate;
    }
    @keyframes fa { from{transform:translate(0,0)} to{transform:translate(-50px,70px)} }
    @keyframes fb { from{transform:translate(0,0)} to{transform:translate(40px,-50px)} }

    /* grid */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 10%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 10%, transparent 75%);
    }

    /* canvas */
    #pcanvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    /* content */
    .scene {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      padding: 2rem;
      gap: 0;
    }

    /* status pill */
    .pill {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.32rem 1rem 0.32rem 0.6rem;
      border: 1px solid rgba(0,229,160,0.2);
      border-radius: 100px;
      background: rgba(0,229,160,0.06);
      backdrop-filter: blur(12px);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2.4rem;
      opacity: 0;
      animation: up 0.7s ease 0.1s forwards;
    }
    .pill-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 7px var(--accent);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* logo / wordmark */
    .wordmark {
      font-size: clamp(5rem, 14vw, 10rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 0.9;
      opacity: 0;
      animation: up 0.9s ease 0.25s forwards;
    }
    .wordmark .x {
      background: linear-gradient(130deg, var(--accent) 0%, #00c085 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(0,229,160,0.25));
    }
    .wordmark .rest { color: var(--text); }

    /* tagline */
    .tagline {
      margin-top: 1.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.7rem, 1.8vw, 0.85rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: up 0.9s ease 0.4s forwards;
    }
    .tagline .flag { font-style: normal; letter-spacing: 0; }

    /* glass card */
    .card {
      margin-top: 3.2rem;
      padding: 1.8rem 2.2rem;
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      background: var(--glass);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      display: flex; flex-direction: column;
      align-items: center; gap: 1.4rem;
      max-width: 400px; width: 100%;
      position: relative; overflow: hidden;
      opacity: 0;
      animation: up 0.9s ease 0.55s forwards;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,229,160,0.25), rgba(91,140,255,0.25), transparent);
    }

    .card-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
    }

    /* countdown */
    .countdown {
      display: flex; align-items: flex-end; gap: 1.2rem;
    }
    .cd-unit {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.25rem;
    }
    .cd-num {
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 800; letter-spacing: -0.05em;
      line-height: 1; font-variant-numeric: tabular-nums;
      min-width: 2.2ch; text-align: center;
    }
    .cd-sep {
      font-size: 2rem; font-weight: 300;
      color: var(--muted); line-height: 1.25;
      padding-bottom: 0.45rem;
    }
    .cd-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.57rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
    }

    /* email */
    .input-row {
      display: flex; width: 100%;
      border: 1px solid var(--glass-border);
      border-radius: 100px; overflow: hidden;
      background: rgba(255,255,255,0.03);
    }
    .wl-input {
      flex: 1; border: none; background: transparent; outline: none;
      padding: 0.75rem 1.1rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      color: var(--text);
    }
    .wl-input::placeholder { color: rgba(236,238,242,0.2); }
    .wl-btn {
      background: var(--accent); color: #07080A;
      border: none; padding: 0.75rem 1.3rem; cursor: pointer;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 0.75rem; font-weight: 700;
      border-radius: 0 100px 100px 0;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .wl-btn:hover { background: #33edB6; transform: scale(1.02); }
    .wl-success {
      display: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; color: var(--accent);
      letter-spacing: 0.08em;
    }

    /* footer */
    .foot {
      position: fixed; bottom: 1.6rem;
      left: 0; right: 0;
      display: flex; justify-content: center; gap: 2rem;
      z-index: 10;
      opacity: 0;
      animation: up 0.9s ease 0.9s forwards;
    }
    .foot a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      text-decoration: none; transition: color 0.2s;
    }
    .foot a:hover { color: var(--text); }

    /* anim */
    @keyframes up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .countdown { gap: 0.8rem; }
      .cd-num { font-size: 1.8rem; }
      .card { padding: 1.4rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="grid-bg"></div>
  <canvas id="pcanvas"></canvas>

  <main class="scene">

    <div class="pill">
      <span class="pill-dot"></span>
      Currently in stealth
    </div>

    <h1 class="wordmark">
      <span class="x">x</span><span class="rest">-bot</span>
    </h1>

    <p class="tagline">
      AI-native hiring for India &nbsp;<em class="flag">🇮🇳</em>
    </p>

    <div class="card">
      <span class="card-label">Launching in</span>

      <div class="countdown">
        <div class="cd-unit">
          <span class="cd-num" id="cd-d">--</span>
          <span class="cd-label">Days</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-unit">
          <span class="cd-num" id="cd-h">--</span>
          <span class="cd-label">Hrs</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-unit">
          <span class="cd-num" id="cd-m">--</span>
          <span class="cd-label">Min</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-unit">
          <span class="cd-num" id="cd-s">--</span>
          <span class="cd-label">Sec</span>
        </div>
      </div>

      <div class="input-row" id="input-row">
        <input class="wl-input" type="email" id="wl-email" placeholder="notify me at your@email.com" />
        <button class="wl-btn" onclick="join()">Notify me</button>
      </div>
      <span class="wl-success" id="wl-success">✓ you're on the list</span>
    </div>

  </main>

  <footer class="foot">
    <a href="mailto:info@x-bot.co">info@x-bot.co</a>
    <a href="#">Privacy</a>
  </footer>

  <script>
    // countdown
    const TARGET = new Date('2026-12-31T00:00:00');
    function tick() {
      const d = TARGET - Date.now();
      if (d <= 0) return;
      const pad = n => String(Math.floor(n)).padStart(2,'0');
      document.getElementById('cd-d').textContent = pad(d/86400000);
      document.getElementById('cd-h').textContent = pad((d%86400000)/3600000);
      document.getElementById('cd-m').textContent = pad((d%3600000)/60000);
      document.getElementById('cd-s').textContent = pad((d%60000)/1000);
    }
    tick(); setInterval(tick, 1000);

    // waitlist
    function join() {
      const v = document.getElementById('wl-email').value;
      if (!v || !v.includes('@')) return;
      document.getElementById('input-row').style.display = 'none';
      document.getElementById('wl-success').style.display = 'block';
    }
    document.getElementById('wl-email').addEventListener('keydown', e => { if(e.key==='Enter') join(); });

    // particles
    (function(){
      const c = document.getElementById('pcanvas');
      const ctx = c.getContext('2d');
      let W, H, pts = [];
      function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
      resize(); window.addEventListener('resize', resize);
      const COLS = ['rgba(0,229,160,','rgba(91,140,255,'];
      function P(){ this.reset(); }
      P.prototype.reset = function(){
        this.x=Math.random()*W; this.y=Math.random()*H;
        this.r=Math.random()*1.2+0.2;
        this.c=COLS[Math.floor(Math.random()*2)];
        this.a=Math.random()*0.4+0.08;
        this.vx=(Math.random()-.5)*.22; this.vy=(Math.random()-.5)*.22-.07;
        this.life=Math.random()*220+80; this.age=0;
      };
      P.prototype.tick=function(){ this.x+=this.vx; this.y+=this.vy; this.age++; if(this.age>this.life) this.reset(); };
      P.prototype.draw=function(){
        const f=Math.min(this.age/25,1)*Math.min((this.life-this.age)/25,1);
        ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle=this.c+(this.a*f)+')'; ctx.fill();
      };
      for(let i=0;i<60;i++){const p=new P(); p.age=Math.floor(Math.random()*p.life); pts.push(p);}
      (function loop(){ ctx.clearRect(0,0,W,H); pts.forEach(p=>{p.tick();p.draw();}); requestAnimationFrame(loop); })();
    })();
  </script>
</body>
</html>
